<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Okul Rehberlik ve Risk Yönetim Sistemi</title>
  <meta name="description" content="E-Okul entegrasyonlu, öğrenci risk haritası ve form yönetim paneli." />
  <meta property="og:title" content="Okul Rehberlik ve Risk Yönetim Sistemi" />
  <meta property="og:description" content="E-Okul entegrasyonlu, öğrenci risk haritası ve form yönetim paneli." />
  <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico" />
  <style>
    body { margin: 0; display: flex; align-items: center; justify-content: center;
           min-height: 100vh; font-family: system-ui, sans-serif; background: #f8fafc; }
    .loader { text-align: center; color: #94a3b8; }
    .dot { display: inline-block; width: 8px; height: 8px; background: #1d4ed8;
           border-radius: 50%; margin: 0 3px; animation: bounce .8s ease infinite; }
    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-10px)} }
  </style>
</head>
<body>
  <div class="loader">
    <div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <p style="margin-top:1rem; font-size:.9rem;">Yönlendiriliyor...</p>
  </div>
  <script type="module">
    // Auth durumuna göre doğru sayfaya yönlendir
    import { authDurumDinle } from "./assets/js/auth.service.js";
    authDurumDinle((user) => {
      if (user) {
        window.location.replace("./assets/pages/dashboard/index.html");
      } else {
        window.location.replace("./assets/pages/login/index.html");
      }
    });
  </script>
</body>
</html>
